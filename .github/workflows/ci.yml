name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The project's minimum Rust (Cargo.toml rust-version), so lints don't
      # change underneath us.
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test (debug build, overflow checks on)
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings -A clippy::needless_range_loop
