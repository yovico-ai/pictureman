name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        run: |
          d=pictureman-${GITHUB_REF_NAME}-linux-x86_64
          mkdir -p $d
          cp target/release/pictureman README.md LICENSE NOTICE packaging/pictureman.desktop $d/
          cp assets/appicon/icon_256.png $d/pictureman.png
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: '*.tar.gz' }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $d = "pictureman-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/pictureman.exe, README.md, LICENSE, NOTICE $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: '*.zip' }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output pictureman \
            target/aarch64-apple-darwin/release/pictureman \
            target/x86_64-apple-darwin/release/pictureman
      - name: Make Picture Man.app
        run: |
          app="Picture Man.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp pictureman "$app/Contents/MacOS/"
          version=${GITHUB_REF_NAME#v}
          sed "s/@VERSION@/$version/g" packaging/Info.plist > "$app/Contents/Info.plist"
          set=pictureman.iconset; mkdir $set
          for s in 16 32 128 256 512; do
            cp assets/appicon/icon_$s.png $set/icon_${s}x${s}.png
            cp assets/appicon/icon_$((s*2)).png $set/icon_${s}x${s}@2x.png 2>/dev/null || true
          done
          cp assets/appicon/icon_64.png $set/icon_32x32@2x.png
          iconutil -c icns $set -o "$app/Contents/Resources/pictureman.icns"
          # Ad-hoc signature so Apple Silicon runs it; still unsigned for Gatekeeper.
          codesign --force --deep --sign - "$app"
          d=pictureman-${GITHUB_REF_NAME}-macos-universal
          mkdir $d && cp -R "$app" README.md LICENSE NOTICE $d/
          ditto -c -k --keepParent $d $d.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: '*.zip' }

  release:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: Picture Man ${{ github.ref_name }}
          files: |
            *.tar.gz
            *.zip
