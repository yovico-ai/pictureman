[package]
name = "pictureman"
version = "1.55.0"
edition = "2024"
rust-version = "1.94"
description = "Picture Man 1.55 (1991-1993), the true-color image editor for Windows 3.x, rebuilt in Rust from its binaries"
license = "MIT"
repository = "https://github.com/yovico-ai/pictureman"
readme = "README.md"
keywords = ["image-editor", "image-processing", "retro", "egui"]
categories = ["multimedia::images", "graphics"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.6.1"
rayon = "1.12.0"
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "Document", "Element", "File", "FileList", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlInputElement", "Url", "Window"] }

[profile.release]
lto = "thin"
strip = true

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.35"
epaint_default_fonts = "0.35"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tga", "tiff"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
