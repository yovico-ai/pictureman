<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picture Man</title>
  <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue">
  <link data-trunk rel="icon" href="assets/appicon/icon_64.png">
  <style>
    /* As in eframe's web template: the canvas is pinned to the viewport so
       egui's pointer coordinates match what is drawn. */
    html { touch-action: manipulation; }
    html, body { overflow: hidden; margin: 0 !important; padding: 0 !important; height: 100%; width: 100%; background: #1b1b1b; }
    canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #bbb; font: 15px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="picture_man"></canvas>
  <div id="loading">Loading Picture Man…</div>
</body>
</html>
